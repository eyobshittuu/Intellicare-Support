services:
  # PostgreSQL Database
  - type: pserv
    name: intellicare-support-db
    plan: free
    databaseName: intellicare_ticketing
    databaseUser: intellicare_user

  # Backend API
  - type: web
    name: intellicare-support-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install && node scripts/migrate.js
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: intellicare-support-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_URL
        value: http://localhost:5173
    healthCheckPath: /api/health
