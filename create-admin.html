<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Super Admin - IntelliCare Support</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .required {
            color: #e74c3c;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #0d47a1;
        }
        
        .status {
            margin-bottom: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 13px;
        }
        
        .status-label {
            font-weight: 600;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Create Super Admin</h1>
        <p class="subtitle">IntelliCare Support System Setup</p>
        
        <div class="status" id="status">
            <div class="status-label">Checking setup status...</div>
        </div>
        
        <div class="info-box">
            ℹ️ This is a one-time setup. Once a super admin is created, this endpoint will be disabled for security.
        </div>
        
        <form id="adminForm">
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required placeholder="admin@intellicare.com">
            </div>
            
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" required placeholder="Min. 6 characters">
            </div>
            
            <div class="form-group">
                <label>First Name <span class="required">*</span></label>
                <input type="text" id="first_name" name="first_name" required placeholder="John">
            </div>
            
            <div class="form-group">
                <label>Last Name <span class="required">*</span></label>
                <input type="text" id="last_name" name="last_name" required placeholder="Doe">
            </div>
            
            <div class="form-group">
                <label>Setup Secret Key <span class="required">*</span></label>
                <input type="text" id="secret_key" name="secret_key" required value="intellicare-setup-2024" placeholder="intellicare-setup-2024">
            </div>
            
            <button type="submit" id="submitBtn">Create Super Admin</button>
        </form>
        
        <div class="message" id="message"></div>
    </div>

    <script>
        const API_URL = 'https://intellicare-support-1.onrender.com/api';
        
        // Check setup status on load
        async function checkStatus() {
            try {
                const response = await fetch(`${API_URL}/setup/status`);
                const data = await response.json();
                
                const statusDiv = document.getElementById('status');
                if (data.admin_exists) {
                    statusDiv.innerHTML = `
                        <div class="status-label" style="color: #27ae60;">✅ Setup Complete</div>
                        <div style="color: #666; margin-top: 5px;">Super admin already exists. You can login to the application.</div>
                    `;
                    document.getElementById('adminForm').style.display = 'none';
                } else {
                    statusDiv.innerHTML = `
                        <div class="status-label" style="color: #e67e22;">⚠️ Setup Required</div>
                        <div style="color: #666; margin-top: 5px;">No super admin found. Please create one below.</div>
                    `;
                }
            } catch (error) {
                console.error('Status check error:', error);
                document.getElementById('status').innerHTML = `
                    <div class="status-label" style="color: #e74c3c;">❌ Connection Error</div>
                    <div style="color: #666; margin-top: 5px;">Could not connect to server. Make sure the backend is running.</div>
                `;
            }
        }
        
        // Call status check
        checkStatus();
        
        // Handle form submission
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            // Get form data
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                secret_key: document.getElementById('secret_key').value
            };
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch(`${API_URL}/setup/create-admin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = `
                        <strong>✅ Success!</strong><br>
                        Super admin created successfully.<br>
                        <strong>Email:</strong> ${data.admin.email}<br>
                        <strong>Role:</strong> ${data.admin.role}<br><br>
                        You can now <a href="https://intellicare-support.vercel.app/login" style="color: #155724; font-weight: 600;">login to the application</a>.
                    `;
                    document.getElementById('adminForm').reset();
                    setTimeout(() => checkStatus(), 2000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.innerHTML = `
                        <strong>❌ Error</strong><br>
                        ${data.message || 'Failed to create admin'}
                    `;
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = `
                    <strong>❌ Connection Error</strong><br>
                    Could not connect to server. Please check if the backend is running.
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Super Admin';
            }
        });
    </script>
</body>
</html>
